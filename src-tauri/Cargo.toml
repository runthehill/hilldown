[package]
name = "hilldown"
version = "0.3.0"
description = "A lightweight desktop Markdown editor and viewer."
authors = ["HillDown Contributors"]
edition = "2021"

[lib]
name = "hilldown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bitflags = "=2.9.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
